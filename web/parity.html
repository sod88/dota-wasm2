<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Parity Check</title>
<style>
:root { --bg: #080b10; --panel: #131824; --edge: #5f4f2b; --gold: #e8c875; --ink: #e9e4d4; --dim: #9aa0ad; --ok: #6fdc8c; --bad: #ff7b6e;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
html, body { margin: 0; background: var(--bg); }
main { max-width: 820px; margin: 0 auto; padding: 32px 16px; }
h1 { font: 800 30px Georgia, serif; color: var(--gold); margin: 0 0 6px; letter-spacing: .04em; }
p { color: var(--dim); line-height: 1.55; margin: 0 0 14px; }
button { font: 700 15px system-ui; color: var(--ink); background: linear-gradient(#7a5a1c, #3b2a0c); border: 1px solid var(--gold); border-radius: 7px; padding: 9px 22px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
label { color: var(--dim); font-size: 14px; margin-left: 14px; }
select { background: #151a27; color: var(--ink); border: 1px solid var(--edge); border-radius: 5px; padding: 4px; }
#log { margin-top: 18px; background: var(--panel); border: 1px solid #2d3548; border-radius: 10px; padding: 12px 14px; font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; min-height: 120px; overflow-wrap: anywhere; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .dim { color: var(--dim); }
#verdict { font: 800 20px Georgia, serif; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>Rust ⇄ C++ parity check</h1>
  <p>Loads <b>moba_engine.wasm</b> (Rust) and <b>moba_engine_cpp.wasm</b> (C++) side by side, plays the same bot matches on both,
     and compares the full game state every second of game time. Build both first with <code>./build.sh</code> and <code>./build-cpp.sh</code>.</p>
  <button id="run">Run check</button>
  <label>Game time per match <select id="mins"><option value="3">3 min</option><option value="10" selected>10 min</option><option value="45">45 min (slow)</option></select></label>
  <div id="verdict"></div>
  <div id="log"></div>
</main>
<script type="module">
import { Engine } from './js/engine.js';
const $ = (id) => document.getElementById(id);
const log = (html) => { $('log').innerHTML += html + '\n'; $('log').scrollTop = 1e9; };
const sleep = () => new Promise((r) => setTimeout(r, 0));

async function runMatch(rs, cc, cfg, mods, minutes) {
  for (const e of [rs, cc]) { e.clearMods(); for (const m of mods) { const errs = e.loadMod(m); if (errs.length) throw new Error(errs.join('; ')); } }
  const ir = rs.start(cfg), ic = cc.start(cfg);
  if (JSON.stringify(ir) !== JSON.stringify(ic)) return 'info JSON differs';
  for (let t = 0; t < minutes * 60 * 30; t += 30) {
    rs.step(30); cc.step(30);
    if (rs.hash() !== cc.hash()) return `state differs after ${((t + 30) / 30).toFixed(0)} s of game time`;
    const a = rs.snapshot(), b = cc.snapshot();
    for (const k of ['g', 'units', 'heroes', 'projs', 'zones', 'events']) if (a[k].join() !== b[k].join()) return `${k} table differs after ${((t + 30) / 30).toFixed(0)} s`;
    if (a.winner >= 0) return null;
    if (t % 900 === 0) await sleep();
  }
  return null;
}

$('run').onclick = async () => {
  $('run').disabled = true; $('log').innerHTML = ''; $('verdict').textContent = '';
  let rs, cc;
  try {
    rs = await Engine.load('rust'); cc = await Engine.load('cpp');
  } catch (e) { log(`<span class="bad">${e.message}</span>`); $('run').disabled = false; return; }
  let mods = [];
  try {
    const idx = await (await fetch('mods/index.json')).json();
    mods = await Promise.all((idx.mods || []).map(async (f) => [f, await (await fetch('mods/' + f)).text()]));
  } catch { /* no mods folder */ }
  const minutes = +$('mins').value;
  const plans = [
    [{ seed: 3, hero: 0, perTeam: 1, fog: true, bot: true }, []],
    [{ seed: 5, hero: 1, perTeam: 2, fog: true, bot: true }, []],
    [{ seed: 7, hero: 2, perTeam: 3, fog: false, bot: true }, []],
    [{ seed: 11, hero: 0, perTeam: 5, fog: true, bot: true }, []],
    ...(mods.length ? [[{ seed: 4, hero: 3, perTeam: 3, fog: true, bot: true }, mods]] : []),
  ];
  let bad = 0;
  for (const [cfg, ms] of plans) {
    const t0 = performance.now();
    const err = await runMatch(rs, cc, cfg, ms.map((m) => m[1]), minutes);
    const what = `${cfg.perTeam}v${cfg.perTeam} seed ${cfg.seed}${ms.length ? ' + mods ' + ms.map((m) => m[0]).join(', ') : ''}`;
    if (err) { bad++; log(`<span class="bad">✗ ${what}: ${err}</span>`); }
    else log(`<span class="ok">✓ ${what}</span> <span class="dim">identical (${((performance.now() - t0) / 1000).toFixed(1)} s)</span>`);
  }
  rs.clearMods(); cc.clearMods();
  $('verdict').innerHTML = bad
    ? `<span class="bad">The two WebAssembly builds diverge.</span> <span class="dim" style="font:14px system-ui">Usually a difference in sin/cos/atan2 between the Rust and C++ math libraries — fine for single player, but lockstep multiplayer needs both sides on the same engine.</span>`
    : '<span class="ok">Both engines produce identical games.</span>';
  $('run').disabled = false;
};
</script>
</body>
</html>
